# Cross-repo 통합 시연용 compose.
#
# 운영 portfolio 에서 본 repo 는 auth-service / notification-hub 와 맞물려 동작합니다.
# 본 파일은 그 두 외부 의존을 *mock* 으로 대체해서, 한 호스트에서 통합 흐름을 검증할 수
# 있게 합니다.
#
#   - mock-auth: nginx — JWK Set + OIDC discovery 만 노출
#   - mock-notification-hub: bitnami/kafka 의 kafka-console-consumer 로 alerts.fired 만 listen
#
# 실 운영용 의존성 (Postgres / Kafka / OpenSearch / ClickHouse / Flink) 은 docker-compose.yml
# 과 동일한 이미지를 그대로 사용. flink 컨테이너는 통합 시연에서 직접 trigger 되지 않으므로
# (Flink job 은 별도 jar 라 본 시연 범위 밖) 제외했습니다 — 알람은 application 안의
# threshold rule consumer path 로 검증.
#
# 실행:
#   docker compose -f docker-compose.integration.yml up -d
#   ../../scripts/integration-demo.sh
#   docker compose -f docker-compose.integration.yml logs -f mock-notification-hub  # alerts.fired 수신 확인
#   docker compose -f docker-compose.integration.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "security"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  kafka:
    # bitnami/kafka 가 2025년 후반부터 Docker Hub 에서 gating — bitnamilegacy 미러 사용.
    image: bitnamilegacy/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports: ["8123:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ../../security-bootstrap/src/main/resources/clickhouse:/docker-entrypoint-initdb.d:ro
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # auth-service stub — JWK Set + OIDC discovery 만 노출. 정적 파일을 이미지에 baking.
  # 운영: https://github.com/ssa1004/auth-service
  mock-auth:
    build:
      context: ./mock-auth
    ports: ["8090:8080"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # notification-hub stub — alerts.fired 만 consume 해서 stdout 으로 출력.
  # 운영: https://github.com/ssa1004/notification-hub
  mock-notification-hub:
    build:
      context: ./mock-notification-hub
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ALERTS_TOPIC: alerts.fired

  # 본 repo 의 application — mock-auth 의 issuer-uri 로 JWT 검증.
  security-app:
    build:
      context: ../..
      dockerfile: infrastructure/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: security
      DB_USER: security
      DB_PASSWORD: security
      KAFKA_BOOTSTRAP: kafka:9092
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_SCHEME: http
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      OAUTH_ISSUER_URI: http://mock-auth:8080
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      mock-auth: { condition: service_healthy }

volumes:
  pg-data:
  ch-data:
