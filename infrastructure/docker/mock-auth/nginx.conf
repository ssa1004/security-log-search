server {
    listen 8080;
    server_name _;

    default_type application/json;
    add_header Cache-Control "no-store" always;

    # OIDC discovery — Spring Boot Resource Server 가 issuer-uri 로 자동 fetch.
    location = /.well-known/openid-configuration {
        alias /usr/share/nginx/html/openid-configuration.json;
    }

    # JWK Set — JWT 서명 검증 public key.
    location = /oauth2/jwks {
        alias /usr/share/nginx/html/jwks.json;
    }

    # 헬스체크 — compose healthcheck 가 사용.
    location = /healthz {
        return 200 '{"status":"UP"}';
    }
}
