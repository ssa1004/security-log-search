apiVersion: v1
kind: ConfigMap
metadata:
  name: security-log-search-config
  namespace: security-log-search
data:
  SPRING_PROFILES_ACTIVE: "prod"
  KAFKA_BOOTSTRAP: "kafka.kafka.svc.cluster.local:9092"
  OPENSEARCH_HOST: "opensearch.opensearch.svc.cluster.local"
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_SCHEME: "http"
  CLICKHOUSE_URL: "jdbc:clickhouse://clickhouse.clickhouse.svc.cluster.local:8123/default"
  CLICKHOUSE_USER: "default"
  OAUTH_ISSUER_URI: "https://auth.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: security-log-search-secrets
  namespace: security-log-search
type: Opaque
stringData:
  DB_HOST: postgres.postgres.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: security
  DB_USER: security
  DB_PASSWORD: change-me
  CLICKHOUSE_PASSWORD: change-me
