apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: security-log-search
  namespace: security-log-search
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: security-log-search
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
