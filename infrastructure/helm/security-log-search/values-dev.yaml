replicaCount: 1

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

config:
  springProfile: dev
  oauth:
    issuerUri: ""

monitoring:
  serviceMonitor:
    enabled: false

# dev 는 NetworkPolicy off — 로컬 디버깅 시 다른 namespace 에서 curl 가능하게.
networkPolicy:
  enabled: false
