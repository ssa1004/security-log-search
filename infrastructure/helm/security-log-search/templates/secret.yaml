# 운영에서는 SealedSecret / ExternalSecret 으로 대체 — 본 template 은 dev / staging 편의용.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "security-log-search.fullname" . }}-secrets
  labels:
    {{- include "security-log-search.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.secrets.dbPassword | quote }}
  clickhouse-password: {{ .Values.secrets.clickHousePassword | quote }}
