spring:
  application:
    name: security-log-search
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:security;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    # 호스트 실행(bootRun) 기본값은 compose 의 EXTERNAL listener(localhost:29092).
    # 컨테이너끼리는 KAFKA_BOOTSTRAP=kafka:9092 로 override (compose / k8s).
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}

server:
  port: 8080
  shutdown: graceful
  # 요청 본문 상한 — API4 (자원 소비 제한). Sigma import / ingest payload 가 5 MB 이상이면 거부.
  tomcat:
    max-http-form-post-size: 5MB
    max-swallow-size: 5MB
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

security:
  opensearch:
    enabled: false
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
    scheme: ${OPENSEARCH_SCHEME:http}
    rollover:
      max-size-bytes: 53687091200   # 50 GB
      max-age-days: 30
  clickhouse:
    enabled: false
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/default}
    user: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
  kafka:
    topics:
      events-normalized: events.normalized
      alerts-fired: alerts.fired
      alert-rules-broadcast: alert-rules.broadcast
    consumer:
      max-poll-records: 200
      alerts-fired-group: security-alerts-fired

resilience4j:
  circuitbreaker:
    instances:
      opensearch:
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
      clickhouse:
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      opensearch:
        maxAttempts: 3
        waitDuration: 200ms
      clickhouse:
        maxAttempts: 3
        waitDuration: 200ms
  bulkhead:
    instances:
      opensearch:
        maxConcurrentCalls: 50
        maxWaitDuration: 100ms
      clickhouse:
        maxConcurrentCalls: 30
        maxWaitDuration: 100ms

logging:
  level:
    root: INFO
    com.example.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:security}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:security}
    password: ${DB_PASSWORD:security}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:}

security:
  opensearch:
    enabled: true
  clickhouse:
    enabled: true

logging:
  level:
    root: INFO
    com.example.security: INFO
