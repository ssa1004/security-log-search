{{- if not .Values.secrets.existingSecret }}
# 운영에서는 SealedSecret / ExternalSecret / CSI Secret Store 로 대체.
# secrets.existingSecret 을 지정하면 본 template 은 만들지 않고 외부 secret 만 참조.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "security-log-search.secretName" . }}
  labels:
    {{- include "security-log-search.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.secrets.dbPassword | quote }}
  clickhouse-password: {{ .Values.secrets.clickHousePassword | quote }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
{{- end }}
