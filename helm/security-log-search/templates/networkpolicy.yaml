{{- if .Values.networkPolicy.enabled }}
# ISMS-P 관점: prod 기본 활성. 들어오는 트래픽은 ingress / monitoring namespace 만,
# 나가는 트래픽은 의존 (Postgres / Kafka / OpenSearch / ClickHouse / Redis) + DNS 만 허용.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "security-log-search.fullname" . }}
  labels:
    {{- include "security-log-search.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "security-log-search.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
  egress:
    {{- with .Values.networkPolicy.egress.postgres }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.kafka }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.opensearch }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.clickhouse }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.redis }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    # DNS — 클러스터 전체에 허용.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
