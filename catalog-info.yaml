---
# Backstage Software Catalog 정의 — security-log-search component + events-search API.
# system 정의는 ssa1004/auth-service 레포에 있다.

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: security-log-search
  description: "SIEM 보안 로그 수집 / 검색 / 알람 플랫폼 — ECS / OCSF + Sigma rules + OpenSearch + ClickHouse + Kafka + Flink, 멀티테넌트 4-layer 격리, ISMS-P"
  annotations:
    github.com/project-slug: ssa1004/security-log-search
    backstage.io/source-location: url:https://github.com/ssa1004/security-log-search
  tags:
    - siem
    - ecs
    - ocsf
    - sigma-rules
    - opensearch
    - clickhouse
    - flink
  links:
    - url: https://github.com/ssa1004/security-log-search
      title: GitHub Repository
    - url: https://github.com/ssa1004/security-log-search/blob/main/README.md
      title: README
    - url: https://github.com/ssa1004/security-log-search/tree/main/docs/adr
      title: ADRs
spec:
  type: service
  lifecycle: experimental
  owner: user:ssa1004
  system: ssa1004-portfolio
  providesApis:
    - events-search
  consumesApis:
    - notification-hub-alerts-fired
  dependsOn:
    - component:auth-service

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: events-search
  description: "보안 이벤트 검색 / 집계 / Sigma rule 평가 REST API (OpenSearch + ClickHouse 백엔드)"
  annotations:
    github.com/project-slug: ssa1004/security-log-search
spec:
  type: openapi
  lifecycle: experimental
  owner: user:ssa1004
  system: ssa1004-portfolio
  definition: |
    openapi: 3.0.3
    info:
      title: Security Events Search API
      version: 1.0.0
      description: |
        ECS / OCSF 정규화된 보안 이벤트를 검색, 집계, Sigma rule 기반으로 탐지하는 API.
        멀티테넌트 4-layer 격리 (network / data / control / policy).
    paths:
      /api/v1/events/search:
        post:
          summary: 보안 이벤트 검색 (cursor pagination)
          parameters:
            - in: header
              name: X-Tenant-Id
              required: true
              schema: { type: string }
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    query: { type: string, description: "Lucene / DSL 쿼리" }
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
                    cursor: { type: string }
                    size: { type: integer, default: 50 }
          responses:
            "200":
              description: 검색 결과
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      events:
                        type: array
                        items: { type: object }
                      nextCursor: { type: string }
      /api/v1/events/aggregate:
        post:
          summary: 보안 이벤트 집계 (ClickHouse)
          parameters:
            - in: header
              name: X-Tenant-Id
              required: true
              schema: { type: string }
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    groupBy: { type: array, items: { type: string } }
                    metric: { type: string, enum: [count, distinct, sum] }
                    interval: { type: string }
          responses:
            "200": { description: 집계 결과 }
      /api/v1/rules/sigma/evaluate:
        post:
          summary: Sigma rule dry-run 평가
          responses:
            "200": { description: matched events }
