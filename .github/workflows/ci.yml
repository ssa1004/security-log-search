name: Security Log Search CI

# push / PR / 수동 trigger 모두 활성. main push 와 v* 태그, main 대상 PR 에서 CI 가 돈다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# 최소권한 — job 별로 필요한 권한만 추가로 부여한다 (build-image / 스캔 job 참고).
permissions:
  contents: read

# 같은 ref 의 이전 실행은 취소 — push 연타 / PR force-push 시 러너 낭비 방지.
# (태그 빌드는 cancel 하지 않도록 ref 를 그대로 그룹키로 사용.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"

jobs:
  test:
    name: Unit + slice tests
    # ubuntu-latest 가 아닌 LTS 핀 — 24.04 EOL (2029) 까지는 reproducible 빌드 보장.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Compile
        run: ./gradlew --no-daemon compileJava compileTestJava

      - name: Run unit tests (domain + application + adapters + streaming)
        run: |
          ./gradlew --no-daemon \
            :security-domain:test \
            :security-application:test \
            :security-adapter-out:test \
            :security-adapter-in:test \
            :security-streaming:test

      - name: Bootstrap context test
        run: ./gradlew --no-daemon :security-bootstrap:test

      - name: Aggregate coverage report (Kover)
        # 위에서 6개 모듈 test 가 이미 돌았으므로 리포트만 집계. integrationTest 는
        # disabledForTestTasks 로 제외돼 Docker 없이 동작.
        run: ./gradlew --no-daemon koverXmlReport koverHtmlReport koverLog

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: build/reports/kover/

  integration-test:
    name: Testcontainers IT
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run e2e Testcontainers
        run: ./gradlew --no-daemon :e2e-tests:integrationTest

      - name: Upload e2e reports (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-reports
          path: |
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**

  build-image:
    name: Build & push container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test, integration-test]
    if: github.event_name == 'push'
    # GHCR push + Trivy SARIF 업로드에 필요한 권한만 이 job 에 부여.
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="main-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infrastructure/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/security-log-search:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Build & push Flink streaming image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infrastructure/Dockerfile.streaming
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/security-log-search-streaming:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # --- 이미지 취약점 스캔 — API + streaming 둘 다. 결과는 SARIF 로 GitHub
      # Security 탭(code scanning)에 올린다. 업로드 실패가 빌드를 막지 않게 upload 만
      # continue-on-error. 게이트(HIGH/CRITICAL fixable 시 fail)는 마지막 단계가 담당. ---
      - name: Trivy scan API image (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/security-log-search:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload API SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@192325c86100d080feab897ff886c34abd4c83a3 # v3.30.3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Trivy scan streaming image (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/security-log-search-streaming:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-streaming.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload streaming SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@192325c86100d080feab897ff886c34abd4c83a3 # v3.30.3
        with:
          sarif_file: trivy-streaming.sarif
          category: trivy-streaming

      # 게이트 — fixable HIGH/CRITICAL 이 있으면 빌드 실패 (두 이미지 모두).
      - name: Trivy gate (API)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/security-log-search:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # streaming 이미지에는 .trivyignore 를 적용한다. 현재 CVE-2026-35194
      # (flink-table-planner, fix=1.20.4+/2.x major) 한 건만 문서화 후 제외하고,
      # 나머지 fixable HIGH/CRITICAL 은 그대로 게이트가 막는다. (API 게이트엔 미적용.)
      - name: Trivy gate (streaming)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/security-log-search-streaming:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  helm-validate:
    name: Helm lint + kubeconform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm lint (default + dev/staging/prod)
        run: |
          CHART=helm/security-log-search
          helm lint "$CHART"
          for env in dev staging prod; do
            helm lint "$CHART" -f "$CHART/values-$env.yaml"
          done

      - name: helm template | kubeconform (default + dev/staging/prod)
        run: |
          CHART=helm/security-log-search
          CRD='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          validate() {
            helm template t "$CHART" "$@" \
              | kubeconform -strict -ignore-missing-schemas -summary \
                  -schema-location default -schema-location "$CRD"
          }
          validate
          for env in dev staging prod; do
            validate -f "$CHART/values-$env.yaml"
          done

  observability:
    name: Prometheus rules (promtool)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0

      - name: Install promtool + yq
        env:
          PROM_VERSION: 2.55.1
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          promtool --version
          yq --version

      - name: Render PrometheusRule and check + test rules
        run: |
          CHART=helm/security-log-search
          helm template t "$CHART" --show-only templates/prometheusrule.yaml \
            | yq eval '{"groups": .spec.groups}' - > /tmp/sls-rules.yaml
          promtool check rules /tmp/sls-rules.yaml
          promtool test rules infrastructure/observability/prometheus/security-log-search.rules.test.yaml
