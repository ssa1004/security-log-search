name: CodeQL

# Java SAST (static analysis). 현재 단계에서는 ci.yml 과 동일하게 push / PR trigger 를
# OFF 하고 수동 trigger + 주간 schedule 만 유지합니다. 자동 trigger 복원 시 아래 push /
# pull_request 블록 주석 해제.
on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 07:00 UTC — Dependabot (월 09:00 KST = 00:00 UTC) 와 시간대를 벌려 둠.
    - cron: "0 7 * * 1"
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read
  security-events: write

# 같은 ref 의 중복 CodeQL 실행 취소 — 스캔이 비싸므로 force-push / 연타 시 낭비 방지.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    # ci.yml 과 동일한 LTS 핀 — ubuntu-latest 가 아닌 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: java-kotlin
          # security-extended — 기본 query set 에 추가 보안 query 포함 (SIEM 백엔드라
          # injection / 인증 우회 류를 넓게 본다).
          queries: security-extended

      # autobuild 대신 명시 컴파일 — security-streaming 은 Flink 의존성을 compileOnly 로만
      # 가지므로 compileJava 까지만 돌려도 CodeQL 이 7 모듈 전체 bytecode 를 수집한다.
      - name: Compile (all modules)
        run: ./gradlew --no-daemon compileJava compileTestJava

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:java-kotlin"
