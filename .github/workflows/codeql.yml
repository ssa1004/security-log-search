name: CodeQL

# Java SAST (static analysis). 현재 단계에서는 ci.yml 과 동일하게 push / PR trigger 를
# OFF 하고 수동 trigger + 주간 schedule 만 유지합니다. 자동 trigger 복원 시 아래 push /
# pull_request 블록 주석 해제.
on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 07:00 UTC — Dependabot (월 09:00 KST = 00:00 UTC) 와 시간대를 벌려 둠.
    - cron: "0 7 * * 1"
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read
  security-events: write

# 같은 ref 의 중복 CodeQL 실행 취소 — 스캔이 비싸므로 force-push / 연타 시 낭비 방지.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    # ci.yml 과 동일한 LTS 핀 — ubuntu-latest 가 아닌 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          # security-extended — 기본 query set 에 추가 보안 query 포함 (SIEM 백엔드라
          # injection / 인증 우회 류를 넓게 본다).
          queries: security-extended

      # autobuild 대신 명시 컴파일 — security-streaming 은 Flink 의존성을 compileOnly 로만
      # 가지므로 compileJava 까지만 돌려도 CodeQL 이 7 모듈 전체 bytecode 를 수집한다.
      - name: Compile (all modules)
        run: ./gradlew --no-daemon compileJava compileTestJava

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:java-kotlin"
