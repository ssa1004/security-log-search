title: Suspicious PowerShell Encoded Command
id: 1c9b2f5e-4d3a-4912-9c2a-7e6e8d3b9c11
status: stable
description: |
  Windows EDR 에서 PowerShell 의 EncodedCommand 인자를 사용하는 process 가 관측됨.
  LOLBin (Living-off-the-Land Binary) 로 페이로드를 inline base64 로 던지는 전형적
  공격 패턴.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: security-log-search demo
date: 2026/01/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    event.action: process_started
  condition: selection
falsepositives:
  - 정상 운영 스크립트 (CI / 패치 자동화) 가 EncodedCommand 사용
level: critical
